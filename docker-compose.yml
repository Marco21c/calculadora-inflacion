services:
  # Solo sirve el frontend público (/calculadora). El backend vive en Vercel
  # (junto con Supabase), y el admin (carga/edición de datos) se despliega
  # aparte, también en Vercel — ver frontend/vercel.json. Este VPS no
  # necesita Postgres ni backend propios.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # URL pública del backend en Vercel, sin barra final. nginx la usa
      # para proxear /api/* (ver frontend/nginx.conf.template).
      BACKEND_URL: "${BACKEND_URL:?falta BACKEND_URL en .env, ej https://tu-backend.vercel.app}"
    ports:
      - "${HTTP_PORT:-80}:80"
